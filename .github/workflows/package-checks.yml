name: Package checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development package
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify protected README
        run: python scripts/check_protected_readme.py
      - name: Lint
        run: ruff check .
      - name: Test offline package behavior
        run: pytest -m "not integration"

  artifacts:
    name: Build and exercise release artifacts
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata and long description
        run: python -m twine check dist/*
      - name: Validate archive contents and dependency boundaries
        run: python scripts/verify_distribution.py dist
      - name: Retain verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdaf-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  installed-artifacts:
    name: Installed artifacts on Python ${{ matrix.python-version }}
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kdaf-distributions
          path: dist/
      - name: Exercise installed wheel outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/kdaf-wheel"
          "${RUNNER_TEMP}/kdaf-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/kdaf-wheel/bin/python" scripts/smoke_installed_package.py
      - name: Exercise installed source distribution outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/kdaf-sdist"
          "${RUNNER_TEMP}/kdaf-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          "${RUNNER_TEMP}/kdaf-sdist/bin/python" scripts/smoke_installed_package.py
