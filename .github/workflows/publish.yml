name: Publish Python distribution

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build and verify immutable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify protected README
        run: python scripts/check_protected_readme.py
      - name: Build source and wheel distributions once
        run: python -m build
      - name: Validate package metadata and long description
        run: python -m twine check dist/*
      - name: Validate TestPyPI candidate contents
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_distribution.py dist
      - name: Validate production tag and contents
        if: github.event_name == 'release'
        run: python scripts/verify_distribution.py dist --expected-tag "${{ github.event.release.tag_name }}"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kdaf-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  installed-artifacts:
    name: Release artifacts on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kdaf-distributions
          path: dist/
      - name: Exercise installed wheel outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/kdaf-wheel"
          "${RUNNER_TEMP}/kdaf-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/kdaf-wheel/bin/python" scripts/smoke_installed_package.py
      - name: Exercise installed source distribution outside the source tree
        run: |
          python -m venv "${RUNNER_TEMP}/kdaf-sdist"
          "${RUNNER_TEMP}/kdaf-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          "${RUNNER_TEMP}/kdaf-sdist/bin/python" scripts/smoke_installed_package.py

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - installed-artifacts
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kdaf-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - build
      - installed-artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kdaf-distributions
          path: dist/
      - name: Publish immutable release with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true
